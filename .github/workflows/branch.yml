name: RlArcPytest & Docker Image
description: Run pytest and build docker image to validate code

env:
  ML_PROJECT_ID: "test"
  IMAGE_NAME: rlarc_train
  IMAGE_TAG: latest
  LOG_LEVEL: "INFO"

defaults:
  run:
    shell: bash
    working-directory: "./"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches-ignore:
      - "dependabot/*"

    paths:
      - "rlarcworld/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/**"
      - "tests/**"

jobs:
  pytest:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show disk usage before build
        run: |
          df -h
          docker system df -v || true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run python -m unittest
        env:
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (buildx + gha cache)
        run: |
          docker buildx build \
            --cache-to=type=gha,mode=max \
            --cache-from=type=gha \
            --progress=plain \
            --platform=linux/amd64 \
            -f devops/Dockerfile \
            --load \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            .