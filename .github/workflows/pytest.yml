name: RlArcPytest & Docker Image
description: Run pytest and build docker image to validate code

env:
  ML_PROJECT_ID: "test"
  IMAGE_NAME: rlarc_train
  IMAGE_TAG: latest

defaults:
  run:
    shell: bash
    working-directory: "./"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches-ignore:
      - "dependabot/*"

    paths:
      - "rlarcworld/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/**"
      - "tests/**"

jobs:
  pytest:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run python -m unittest
            
      - name: Build Docker Image
        run: docker buildx build -t ${IMAGE_NAME}:${IMAGE_TAG} --file devops/Dockerfile . --platform=linux/amd64