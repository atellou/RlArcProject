[project]
name = "rlarcworld"
version = "0.1.0"
description = "An environment to train on arc dataset a model-based reinforcement learning agent"
authors = [
    {name = "atellou", email = "andresfe.t.u@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "torch",
    "gymnasium",
    "matplotlib",
    "numpy",
    "torchrl",
    "tensorboard",
    "standard-imghdr",
    "torchvision",
    "pyyaml",
    "google-cloud-aiplatform",
    "gcsfs",
    "google-cloud-logging",
    "python-json-logger",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=8.4.1",
]
