[project]
name = "rlarcworld"
version = "0.1.0"
description = "An enviroment to train on arc dataset a model-based reinforcement learning agent"
authors = ["atellou <andresfe.t.u@gmail.com>"]
license = "http://www.apache.org/licenses/"
readme = "README.md"
license-file = "LICENSE"
requires-python = "==3.10.*"
dependencies = [
    "torch",
    "gymnasium",
    "matplotlib",
    "numpy",
    "torchrl",
    "tensorboard",
    "standard-imghdr",
    "torchvision",
    "pyyaml",
    "google-cloud-aiplatform",
    "gcsfs",
    "google-cloud-logging",
    "python-json-logger",
]

[dependency-groups]
dev = [
    "ipykernel",
]
