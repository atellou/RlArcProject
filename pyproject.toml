[project]
name = "rlarcworld"
version = "0.1.0"
description = "An environment to train on arc dataset a model-based reinforcement learning agent"
authors = [
    {name = "atellou", email = "andresfe.t.u@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "transformers>=4.57.3",
    "opencv-python>=4.12.0.88",
    "tensorboard>=2.20.0",
    "tensordict>=0.9.1",
    "torch>=2.8.0",
    "gymnasium>=1.2.0",
    "numpy>=2.2.6",
    "torchrl>=0.9.2",
    "torchvision>=0.23.0",
]

[project.optional-dependencies]
aws-sagemaker = [
    "sagemaker>=3.0.0",
    "botocore[crt]>=1.32.23",
    "boto3>=1.42.16",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest>=8.4.1",
    "pre-commit>=3.8.0",
    "mypy>=1.11.2",
    "interrogate>=1.7.0",
]

# Ruff configuration (lint and formatting)
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
  # Allow missing module docstrings in tests and __init__ modules via per-file-ignores
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["D100", "D101", "D102", "D103", "D104"]
"**/__init__.py" = ["D104"]

# Mypy configuration
[tool.mypy]
python_version = "3.12"
packages = ["rlarcworld"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "rlarcworld.models.vit_arc"
ignore_errors = true

# Interrogate configuration (docstring coverage)
[tool.interrogate]
fail_under = 0
verbose = true
quiet = false
whitelist_regex = ["rlarcworld/.*"]
ignore-init-method = true
ignore-init-module = true
ignore-module = false
ignore-nested-functions = true
ignore-private = false
ignore-property-decorators = false
exclude = ["tests", "build", "dist", ".venv", ".git"]
