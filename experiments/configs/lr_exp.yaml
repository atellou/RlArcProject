# Learning Rate V.S. Temporal Difference Learning Steps Analysis Experiments
#
# Model: ~1.3M trainable parameters
# Grid: 30x30 = 900 cells (potential changes per episode)
#
# Learning Rate Rationale:
#   - 1.0e-3: Aggressive, may be unstable but fast if it works
#   - 3.0e-4: Standard for transformers with ~1M params
#   - 1.0e-4: Conservative, slower but more stable
#   - 3.0e-5: Very conservative, for fine-tuning or stability
#
# N-Step Rationale (grid is 30x30 = 900 cells):
#   - 1: Standard TD(0), immediate credit assignment
#   - 5: Short horizon, ~0.5% of max episode length
#   - 15: Medium horizon, covers small grid regions
#   - 30: One row/column worth of changes
#   - 50: Moderate lookahead for multi-step patterns
#
# Total: 1 LR × 5 n_steps = 5 experiments

lr_base_nstep_5:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=5 - Short horizon"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 5
  distributional:
    v_min:
      pixel_wise_n_reward: -20
      binary_n_reward: -10
    v_max:
      pixel_wise_n_reward: 5
      binary_n_reward: 5
    num_atoms:
      pixel_wise_n_reward: 51
      binary_n_reward: 31


lr_base_nstep_15:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=15 - Medium horizon"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 15
  distributional:
    v_min:
      pixel_wise_n_reward: -40
      binary_n_reward: -25
    v_max:
      pixel_wise_n_reward: 10
      binary_n_reward: 10
    num_atoms:
      pixel_wise_n_reward: 101
      binary_n_reward: 71


lr_base_nstep_30:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=30 - Row-sized horizon"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 30
  distributional:
    v_min:
      pixel_wise_n_reward: -80
      binary_n_reward: -50
    v_max:
      pixel_wise_n_reward: 20
      binary_n_reward: 20
    num_atoms:
      pixel_wise_n_reward: 101
      binary_n_reward: 71


lr_base_nstep_50:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=50 - Moderate lookahead"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 50
  replay_buffer: # Required for 50 steps warm up
    size: 50000
    alpha: 0.2
    beta: 0.2
    warmup_ratio: 0.04
  distributional:
    v_min:
      pixel_wise_n_reward: -120
      binary_n_reward: -80
    v_max:
      pixel_wise_n_reward: 30
      binary_n_reward: 30
    num_atoms:
      pixel_wise_n_reward: 151
      binary_n_reward: 111
