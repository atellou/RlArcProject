# Base configuration for ArcD4PG experiments
# All other configs can inherit from this and override specific values

dataset: "/home/andresftu/Documents/Repos/RlArcProject/tests/test_data"

env:
  grid_size: 30
  color_values: 11
  max_penalty: 1.0
  step_cost: 0.0
  perfect_no_submit_penalty_coef: 0.75
  zero_improvement_penalty: 0.25
  batch_size: 32

network:
  d_model: 128
  d_ff: 512
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  ape_type: "SinusoidalAPE2D"
  rpe_type: "Two-slope-Alibi"
  use_ope: true
  ape_mixer: "weighted_sum_no_norm_vec"
  trainable_ape: false
  use_index_grid: true
  use_temporal: true
  use_examples: true
  example_compression_tokens: 64
  grid_compression_tokens: 64
  compression_method: "learned"
  max_learnable_examples: 1


d4pg:
  share_network: true
  policy_lr: 3.0e-4
  critic_lr: 3.0e-4
  gamma: 0.99
  tau: 0.01
  lr_scheduler_kwargs: null
  n_step_config:
    n_steps: 1
  compute_td_error: true
  carsm: false
  entropy_coef: 0.01
  entropy_coef_decay: 1.0
  entropy_floor_coef: 0.0
  min_entropy: 0.2
  submit_entropy_scale: 0.25
  target_update_frequency: 10
  model_update_frequency: 1
  cache_enabled: true
  max_grad_norm: 10.0

# sum_{i=0}^{n-1} gamma^i * (-1) = -sum_{i=0}^{n-1} 0.99^i
distributional:
  num_atoms:
    pixel_wise: 21
    binary: 21
  v_min:
    pixel_wise: -2
    binary: -2
  v_max:
    pixel_wise: 1
    binary: 1

replay_buffer:
  size: 50000
  alpha: 0.2
  beta: 0.2
  warmup_ratio: 0.02

training:
  max_steps_per_epoch: 3000
  max_steps_per_episode: 1000 # Max possible steps and a little more
  validation_epochs: 1
  validation_steps_per_epoch: 100
  validation_steps_per_episode: 100
  validation_steps_frequency: 300
  min_train_batch_size: 8
  augmentation_enabled: false
  enable_curriculum: true
  curriculum_replace_probabilities:
    on_warmup: 1.0
    on_episode_start: 0.5
    on_train: 0.02
    episode_start_steps: 50
  curriculum_pixel_location_strategy: random

world_model:
  enabled: false
  learning_rate: 1.0e-4
  lr_scheduler_kwargs: null
  imagination_horizon: 5
  imagination_ratio: 5
  imagination_frequency: 10
  model_update_frequency: 10

checkpoint:
  save_frequency: 100
  checkpoint_dir: "checkpoints"
  improvement_checkpoint_enabled: true

logging:
  tensorboard_enabled: true
  log_frequency: 10
  tb_minimal_frequency: 1
  tb_medium_frequency: 100

system:
  amp_enabled: false
  use_checkpointing: false
  device: null

reproducibility:
  global_seed: 42
  dataset_seed: 42
  augmentation_seed: 42
  torch_deterministic: true
