# Base configuration for ArcD4PG experiments
# All other configs can inherit from this and override specific values

dataset_path: "/home/andresftu/Documents/Repos/RlArcProject/tests/test_data"

env:
  grid_size: 30
  color_values: 10
  max_penalty: 1.0
  batch_size: 32

network:
  d_model: 128
  d_ff: 512
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  ape_type: "SinusoidalAPE2D"
  rpe_type: "Two-slope-Alibi"
  use_ope: true
  ape_mixer: "weighted_sum_no_norm_vec"
  trainable_ape: false
  use_index_grid: true
  use_temporal: false
  use_examples: false


d4pg:
  policy_lr: 3e-4
  critic_lr: 3e-3
  gamma: 0.99
  tau: 0.005
  lr_scheduler_kwargs: null
  n_step_config:
    n_steps: 1
  compute_td_error: true
  carsm: false
  entropy_coef: 0.0
  entropy_coef_decay: 1.0
  target_update_frequency: 10
  max_grad_norm: 0.0

distributional:
  num_atoms:
    pixel_wise: 21
    binary: 21
  v_min:
    pixel_wise: -1
    binary: -1
  v_max:
    pixel_wise: 1
    binary: 1

replay_buffer:
  size: 100000
  alpha: 0.6
  beta: 0.4

training:
  max_steps_per_epoch: 1000
  validation_epochs: 1
  validation_steps_per_epoch: 100
  validation_epochs_frequency: 1
  validation_steps_frequency: 100
  min_train_batch_size: 2

world_model:
  enabled: false
  learning_rate: 1e-4
  lr_scheduler_kwargs: null
  imagination_horizon: 5
  imagination_ratio: 5
  imagination_frequency: 10
  model_update_frequency: 10

checkpoint:
  save_frequency: 1000
  checkpoint_dir: "checkpoints"

system:
  amp_enabled: true
  device: null
  seed: 42
