# =============================================================================
# CURRICULUM EXPERIMENTS
# =============================================================================

ex13_base_no_curriculum:
  description: "ex13 reward base, no curriculum (control)"
  env:
    wrong_submit_penalty: 1.0
    step_cost: 0.01
    perfect_no_submit_penalty_coef: 0.50
    zero_improvement_penalty: 0.1
    shaping_clamp_min: 0.5
    shaping_clamp_min_tau_steps: 0
  training:
    enable_curriculum: false

ex13_curriculum_mild:
  description: "ex13 reward base + mild curriculum (warmup=1.0, episode_start=0.25 for first 50 steps, on_train=0.05)"
  env:
    wrong_submit_penalty: 1.0
    step_cost: 0.01
    perfect_no_submit_penalty_coef: 0.50
    zero_improvement_penalty: 0.1
    shaping_clamp_min: 0.5
    shaping_clamp_min_tau_steps: 0
  training:
    enable_curriculum: true
    curriculum_replace_probabilities:
      on_warmup: 1.0
      on_episode_start: 0.25
      on_train: 0.05
      episode_start_steps: 50
    curriculum_pixel_location_strategy: random

ex13_curriculum_medium:
  description: "ex13 reward base + medium curriculum (warmup=1.0, episode_start=0.50 for first 50 steps, on_train=0.10)"
