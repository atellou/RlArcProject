# =============================================================================
# CURRICULUM EXPERIMENTS
# =============================================================================

low_penalties_base_curriculum:
  description: "Curriculum run with 'No submit penalty' and 'zero improvement penalty' low"
  env:
    perfect_no_submit_penalty_coef: 0.25
    zero_improvement_penalty: 0.05
  training:
    enable_curriculum: true
    curriculum_replace_probabilities:
      on_warmup: 1.0
      on_episode_start: 1.0
      on_train: 0.0
      episode_start_steps: 50
    curriculum_pixel_location_strategy: random

low_improvement_penalty_base_curriculum:
  description: "Curriculum run with 'zero improvement penalty' low"
  env:
    perfect_no_submit_penalty_coef: 0.75
    zero_improvement_penalty: 0.05
  training:
    enable_curriculum: true
    curriculum_replace_probabilities:
      on_warmup: 1.0
      on_episode_start: 1.0
      on_train: 0.0
      episode_start_steps: 50
    curriculum_pixel_location_strategy: random

low_penalties_on_train_curriculum:
  description: "Curriculum run with 'No submit penalty' and 'zero improvement penalty' low. Add 5% of change getting curriculum samples during train (aside of episode start)"
  env:
