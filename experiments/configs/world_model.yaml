base_wm:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=1 + World Model"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
  world_model:
    enabled: true
    learning_rate: 1.0e-4
    imagination_horizon: 5
    imagination_ratio: 5
    imagination_frequency: 10
    model_update_frequency: 10

wm_ns_base_nstep_5:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=5 - Short horizon + World Model"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 5
  world_model:
    enabled: true
    learning_rate: 1.0e-4
    imagination_horizon: 5
    imagination_ratio: 5
    imagination_frequency: 10
    model_update_frequency: 10
  distributional:
    v_min:
      pixel_wise_n_reward: -20
      binary_n_reward: -10
    v_max:
      pixel_wise_n_reward: 5
      binary_n_reward: 5
    num_atoms:
      pixel_wise_n_reward: 51
      binary_n_reward: 31


