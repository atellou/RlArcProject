wm_ns_base_nstep_30:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=30 - Row-sized horizon + World Model"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 30
  world_model:
    enabled: true
    learning_rate: 1.0e-4
    imagination_horizon: 8
    imagination_ratio: 5
    imagination_frequency: 10
    model_update_frequency: 10
  distributional:
    v_min:
      pixel_wise_n_reward: -80
      binary_n_reward: -50
    v_max:
      pixel_wise_n_reward: 20
      binary_n_reward: 20
    num_atoms:
      pixel_wise_n_reward: 101
      binary_n_reward: 71


wm_ns_base_nstep_50:
  description: "Base LR (policy=3.0e-4, critic=3.0e-4), n_steps=50 - Moderate lookahead + World Model"
  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-4
    n_step_config:
      n_steps: 50
  world_model:
    enabled: true
    learning_rate: 1.0e-4
    imagination_horizon: 10
    imagination_ratio: 5
    imagination_frequency: 10
    model_update_frequency: 10
  replay_buffer: # Required for 50 steps warm up
    size: 50000
    alpha: 0.2
    beta: 0.2
    warmup_ratio: 0.04
  distributional:
    v_min:
      pixel_wise_n_reward: -120
      binary_n_reward: -80
    v_max:
      pixel_wise_n_reward: 30
      binary_n_reward: 30
    num_atoms:
      pixel_wise_n_reward: 151
      binary_n_reward: 111
