# =============================================================================
# HEALTHCHECK EXPERIMENTS
# Enables most features to test if everything works
# =============================================================================

healthcheck:
  description: "Healthcheck experiment"

  env:
    grid_size: 30
    color_values: 11
    max_penalty: 1.0
    step_cost: 0.01
    perfect_no_submit_penalty_coef: 0.75
    zero_improvement_penalty: 0.25
    shaping_clamp_min: -0.5
    shaping_clamp_min_tau_steps: 100
    batch_size: 32
  distributional:
    v_min:
      pixel_wise_n_reward: -10
      binary_n_reward: -5
    v_max:
      pixel_wise_n_reward: 1
      binary_n_reward: 1
    num_atoms:
      pixel_wise_n_reward: 51
      binary_n_reward: 21

  world_model:
    enabled: true
    imagination_frequency: 3
    model_update_frequency: 3

  d4pg:
    policy_lr: 3.0e-4
    critic_lr: 3.0e-3
    n_step_config:
      n_steps: 5
    share_network: true
    model_update_frequency: 2
    cache_enabled: true

  network:
      use_index_grid: true
      use_temporal: true
      use_examples: true
      example_compression_tokens: 32
      grid_compression_tokens: 128
      compression_method: "learned"
      max_learnable_examples: 2

  logging:
    tensorboard_enabled: true
    log_frequency: 1
    tb_minimal_frequency: 1
    tb_medium_frequency: 1

  training:
    enable_curriculum: true
    curriculum_replace_probabilities:
      on_warmup: 1.0
      on_episode_start: 1.0
      on_train: 0.05
      episode_start_steps: 100
    curriculum_pixel_location_strategy: random
