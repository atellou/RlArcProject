# =============================================================================
# REWARD EXPERIMENTS: First Iteration
# =============================================================================

re1_no_penalty:
  description: "No penalties,lowest reward is 0 and highest is 2 (Improvement Or Submit)"
  env:
    wrong_submit_penalty: 0.0
    step_cost: 0.0
    perfect_no_submit_penalty_coef: 0.0
    zero_improvement_penalty: 0.0
    shaping_clamp_min: 0.0
    shaping_clamp_min_tau_steps: 0
  distributional:
    num_atoms:
      pixel_wise: 41
      binary: 21
    v_min:
      pixel_wise: -2
      binary: -1
    v_max:
      pixel_wise: 2
      binary: 1

