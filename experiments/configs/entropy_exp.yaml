
# =============================================================================
# REGULARIZATION EXPERIMENTS
# =============================================================================
en1_no_entropy_regularization:
  description: "Control: no entropy regularization (no coef, no floor)"
  d4pg:
    entropy_coef: 0.0
    entropy_floor_coef: 0.0
    min_entropy: 0.0

en2_entropy_floor_weak:
  description: "Entropy floor (weak): delay collapse with minimal regularization"
  d4pg:
    entropy_coef: 0.0
    entropy_floor_coef: 0.01
    min_entropy: 0.1

en3_entropy_floor_base:
  description: "Entropy floor (base): current best performer (delays no-op collapse)"
  d4pg:
    entropy_coef: 0.0
    entropy_floor_coef: 0.02
    min_entropy: 0.2

en4_entropy_floor_strong:
  description: "Entropy floor (strong): test if stronger floor further delays collapse"
  d4pg:
    entropy_coef: 0.0
    entropy_floor_coef: 0.05
    min_entropy: 0.3

en5_entropy_floor_base_plus_small_entropy_coef:
  description: "Entropy floor (base) + small entropy_coef (adds gentle exploration pressure)"
  d4pg:
    entropy_coef: 0.01
    entropy_coef_decay: 0.99
    entropy_floor_coef: 0.02
    min_entropy: 0.2

en6_entropy_floor_base_heads:
  description: "Entropy floor (base) + small entropy_coef (adds gentle exploration pressure)"
  d4pg:
    entropy_floor_coef: 0.02
    entropy_coef_decay: 1.0
    min_entropy: 0.2
    submit_entropy_scale: 0.25
    color_entropy_scale: 1.25

# Base for the entropy experiments
en7_curriculum_mild_entropy_floor_with_heads_entropy:
  description: "ex13 reward base + mild curriculum + entropy floor (prevents sudden collapse)"
  env:
    wrong_submit_penalty: 1.0
    step_cost: 0.01
    perfect_no_submit_penalty_coef: 0.50
    zero_improvement_penalty: 0.1
    shaping_clamp_min: 0.5
    shaping_clamp_min_tau_steps: 0
  d4pg:
    entropy_floor_coef: 0.02
    min_entropy: 0.2
    submit_entropy_scale: 0.25
    color_entropy_scale: 1.5
  training:
    enable_curriculum: true
    curriculum_replace_probabilities:
      on_warmup: 1.0
      on_episode_start: 0.25
      on_train: 0.05
      episode_start_steps: 50
    curriculum_pixel_location_strategy: random

