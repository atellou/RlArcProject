submit_entropy_scale_0_25:
  description: "Reduce submit-head entropy contribution (0.25x)"
  d4pg:
    submit_entropy_scale: 0.25

submit_entropy_scale_0_5:
  description: "Reduce submit-head entropy contribution (0.5x)"
  d4pg:
    submit_entropy_scale: 0.5

submit_entropy_scale_0_0:
  description: "Disable submit-head entropy contribution (0.0x)"
  d4pg:
    submit_entropy_scale: 0.0


