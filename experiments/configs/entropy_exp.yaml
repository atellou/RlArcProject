
# =============================================================================
# REGULARIZATION EXPERIMENTS
# =============================================================================

# TODO: Add hyperparameter sweep from reward experiments selection
no_entropy_regularization:
  description: "No entropy regularization experiment"
  d4pg:
    entropy_coef: 0.0
    entropy_floor_coef: 0.0
    min_entropy: 0.0

small_entropy_regularization:
  description: "Small entropy regularization experiment"
  d4pg:
    entropy_coef: 0.01
    entropy_coef_decay: 0.99
    entropy_floor_coef: 0.01
    min_entropy: 0.01

strong_entropy_regularization:
  description: "Strong entropy regularization experiment"
  d4pg:
    entropy_coef: 0.5
    entropy_coef_decay: 0.99999999
    entropy_floor_coef: 0.05
    min_entropy: 0.3

perpetual_entropy_regularization:
  description: "Perpetual entropy regularization experiment"
  d4pg:
    entropy_coef: 0.5
    entropy_coef_decay: 1.0
    entropy_floor_coef: 0.05
    min_entropy: 0.3


